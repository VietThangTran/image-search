services:
  web:
    build: .
    container_name: image-search
    volumes:
      - .uploads:/app/uploads
    ports:
      - "8000:8000"
    networks:
      - nginx
      - local
    depends_on:
      - db

  db:
    image: postgres:latest
    container_name: image-search-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    networks:
      - local
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d

networks:
  nginx:
    external: true
  local:

volumes:
  pgdata: